# path/user.yaml

paths:
  /users:
    get:
      tags:
        - Usuários
      summary: Listar todos os usuários
      description: Retorna uma lista de todos os usuários disponíveis
      responses:
        "200":
          description: Lista de usuários retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/users"
        "404":
          description: Nenhum usuário encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /users/create:
    post:
      tags:
        - Usuários
      summary: Criar um novo usuário
      description: Adiciona um novo usuário ao sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /users/get-by-id/{id}:
    get:
      tags:
        - Usuários
      summary: Buscar usuário por ID
      description: Retorna os detalhes de um usuário específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "jfufhebgfkjehvgbef"
      responses:
        "200":
          description: Usuário encontrado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/users"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /users/update/{id}:
    put:
      tags:
        - Usuários
      summary: Atualizar usuário
      description: Atualiza um usuário existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "jfufhebgfkjehvgbef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreateUser"
      responses:
        "200":
          description: Usuário atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /users/delete/{id}:
    delete:
      tags:
        - Usuários
      summary: Apagar um usuário
      description: Apaga um usuário específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "jfufhebgfkjehvgbef"
      responses:
        "200":
          description: Usuário apagado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"