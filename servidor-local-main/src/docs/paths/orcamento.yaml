paths:
  /orcamentos:
    get:
      tags: [Orcamentos]
      summary: Listar todos os orcamentos
      responses:
        "200":
          description: Orcamentos listados com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseSucesso"
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Orcamento"
        "500":
          description: Erro interno ao listar orcamentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamentos/create:
    post:
      tags: [Orcamentos]
      summary: Criar um novo orcamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrcamento"
      responses:
        "201":
          description: Orcamento criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamentos/get-by-id/{id}:
    get:
      tags: [Orcamentos]
      summary: Obter orcamento por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Orcamento encontrado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Orcamento nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamentos/update/{id}:
    put:
      tags: [Orcamentos]
      summary: Atualizar um orcamento existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrcamento"
      responses:
        "200":
          description: Orcamento atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Orcamento nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamentos/{id}/calcular:
    put:
      tags: [Orcamentos]
      summary: Calcular total de um orcamento
      description: Consolida as prestacoes do orcamento cruzando preco_hora com horas_estimadas e aplicando taxa de urgencia ou desconto do prestador.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Total calculado e gravado no orcamento
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseSucesso"
                properties:
                  data:
                    $ref: "#/components/schemas/OrcamentoCalculoResultado"
        "400":
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Orcamento nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamentos/delete/{id}:
    delete:
      tags: [Orcamentos]
      summary: Apagar um orcamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Orcamento apagado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Orcamento nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
