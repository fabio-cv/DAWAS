# path/orcamento.yaml

paths:
  /orcamentos:
    get:
      tags:
        - Orçamentos
      summary: Listar todos os orçamentos
      description: Retorna uma lista de todos os orçamentos disponíveis
      responses:
        "200":
          description: Lista de orçamentos retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/orcamentos"
        "404":
          description: Nenhum orçamento encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /orcamentos/create:
    post:
      tags:
        - Orçamentos
      summary: Criar um novo orçamento
      description: Adiciona um novo orçamento ao sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreateOrcamento"
      responses:
        "201":
          description: Orçamento criado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /orcamentos/get-by-id/{id}:
    get:
      tags:
        - Orçamentos
      summary: Obter orçamento por ID
      description: Retorna os detalhes de um orçamento específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orçamento
          schema:
            type: string
          example: "abc123xyz"
      responses:
        "200":
          description: Orçamento encontrado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "404":
          description: Orçamento não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /orcamentos/update/{id}:
    put:
      tags:
        - Orçamentos
      summary: Atualizar um orçamento existente
      description: Atualiza os detalhes de um orçamento específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orçamento a ser atualizado
          schema:
            type: string
          example: "abc123xyz"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreateOrcamento"
      responses:
        "200":
          description: Orçamento atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Orçamento não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /orcamentos/delete/{id}:
    delete:
      tags:
        - Orçamentos
      summary: Apagar um orçamento
      description: Apaga um orçamento específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orçamento a ser apagado
          schema:
            type: string
          example: "abc123xyz"
      responses:
        "200":
          description: Orçamento apagado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Orçamento não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /orcamentos/calcular/{id}:
    put:
      tags:
        - Orçamentos
      summary: Calcular o total de um orçamento
      description: >
        Motor lógico de cálculo. Para cada prestação de serviço do orçamento,
        encontra a proposta com estado "aceito", aplica as regras de negócio
        (taxa de urgência +20% e desconto do prestador) e grava o total
        resultante na tabela tbl_orcamento.
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orçamento a calcular
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Total calculado e gravado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Total do orcamento calculado com sucesso"
                  data:
                    type: object
                    properties:
                      total:
                        type: number
                        example: 480.00
        "400":
          description: ID não fornecido
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Orçamento não encontrado ou sem propostas aceites
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

