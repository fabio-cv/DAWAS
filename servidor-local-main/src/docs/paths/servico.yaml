# path/servico.yaml

paths:
  /servicos:
    get:
      summary: Listar todos os serviços
      description: Retorna uma lista de todos os serviços disponíveis
      responses:
        "200":
          description: Lista de serviços retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/servicos"
        "404":
          description: Nenhum serviço encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/RespostaError"

  /servicos/create:
    post:
      summary: Criar um novo serviço
      description: Adiciona um novo serviço ao sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreateService"
      responses:
        "201":
          description: Serviço criado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/RespostaSucesso"

        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/RespostaError"

  /servicos/get-by-id/{id}:
    get:
      summary: Obter serviço por ID
      description: Retorna os detalhes de um serviço específico usando seu ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do serviço 
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Serviço encontrado 
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/RespostaSucesso"
          "404":
            description: Serviço não encontrado
            content:
              application/json:
                schema:
                  type: object
                  $ref: "#/components/schemas/RespostaError"

  /servicos/update/{id}:
    put:
      summary: Atualizar um serviço existente
      description: Atualiza os detalhes de um serviço específico usando seu ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do serviço a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreateService"
      responses:
        "200":
          description: Serviço encontrado 
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/RespostaSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/RespostaError"
        "404":
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/RespostaError"

  /servicos/delete/{id}:
    delete:
      summary: Apagar um serviço
      description: Apaga um serviço especifico pelo ID   
      parameters: 
        - name: id
          in: path
          required: true
          description: ID do serviço a ser apagado
          schema:
            type: integer
            example: 1
      response:
        "200":
          description: Serviço apagado  com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/RespostaSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/RespostaError"
        "404":
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/RespostaError"
    
              
                  
                  
                  


          
 