# path/prestador.yaml

paths:
  /prestadores:
    get:
      tags:
        - Prestadores
      summary: Listar todos os prestadores
      description: Retorna uma lista de todos os prestadores disponíveis
      responses:
        "200":
          description: Lista de prestadores retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/prestadores"
        "404":
          description: Nenhum prestador encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /prestadores/create:
    post:
      tags:
        - Prestadores
      summary: Criar um novo prestador
      description: Adiciona um novo prestador ao sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreatePrestador"
      responses:
        "201":
          description: Prestador criado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /prestadores/get-by-id/{id}:
    get:
      tags:
        - Prestadores
      summary: Obter prestador por ID
      description: Retorna os detalhes de um prestador específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestador
          schema:
            type: string
          example: "abc123xyz"
      responses:
        "200":
          description: Prestador encontrado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "404":
          description: Prestador não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /prestadores/update/{id}:
    put:
      tags:
        - Prestadores
      summary: Atualizar um prestador existente
      description: Atualiza os detalhes de um prestador específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestador a ser atualizado
          schema:
            type: string
          example: "abc123xyz"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreatePrestador"
      responses:
        "200":
          description: Prestador atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Prestador não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /prestadores/delete/{id}:
    delete:
      tags:
        - Prestadores
      summary: Apagar um prestador
      description: Apaga um prestador específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestador a ser apagado
          schema:
            type: string
          example: "abc123xyz"
      responses:
        "200":
          description: Prestador apagado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Prestador não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
