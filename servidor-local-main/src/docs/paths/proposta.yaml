paths:
  /propostas:
    get:
      tags: [Propostas]
      summary: Listar todas as propostas
      responses:
        "200":
          description: Propostas listadas com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucesso"
        "500":
          description: Erro interno ao listar propostas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /propostas/create:
    post:
      tags: [Propostas]
      summary: Criar uma nova proposta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposta"
      responses:
        "201":
          description: Proposta criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /propostas/get-by-id/{id}:
    get:
      tags: [Propostas]
      summary: Obter proposta por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposta encontrada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Proposta nao encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /propostas/update/{id}:
    put:
      tags: [Propostas]
      summary: Atualizar uma proposta existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposta"
      responses:
        "200":
          description: Proposta atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Proposta nao encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /propostas/{id}/aceitar:
    put:
      tags: [Propostas]
      summary: Aceitar uma proposta
      description: O dono do orcamento aceita a proposta, o servico correspondente passa para em_progresso e as propostas concorrentes ficam recusadas.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposta aceite com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseSucesso"
                properties:
                  data:
                    $ref: "#/components/schemas/PropostaAceitacaoResultado"
        "401":
          description: Token invalido ou expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "403":
          description: Utilizador sem permissao para aceitar a proposta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Proposta nao encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /propostas/delete/{id}:
    delete:
      tags: [Propostas]
      summary: Apagar uma proposta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposta apagada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Proposta nao encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
