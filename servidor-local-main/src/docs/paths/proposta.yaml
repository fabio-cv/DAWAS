# path/proposta.yaml

paths:
  /propostas:
    get:
      tags:
        - Propostas
      summary: Listar todas as propostas
      description: Retorna uma lista de todas as propostas disponíveis
      responses:
        "200":
          description: Lista de propostas retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/propostas"
        "404":
          description: Nenhuma proposta encontrada
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /propostas/create:
    post:
      tags:
        - Propostas
      summary: Criar uma nova proposta
      description: Adiciona uma nova proposta ao sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreateProposta"
      responses:
        "201":
          description: Proposta criada com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /propostas/get-by-id/{id}:
    get:
      tags:
        - Propostas
      summary: Obter proposta por ID
      description: Retorna os detalhes de uma proposta específica pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da proposta
          schema:
            type: string
          example: "abc123xyz"
      responses:
        "200":
          description: Proposta encontrada com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "404":
          description: Proposta não encontrada
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /propostas/update/{id}:
    put:
      tags:
        - Propostas
      summary: Atualizar uma proposta existente
      description: Atualiza os detalhes de uma proposta específica pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da proposta a ser atualizada
          schema:
            type: string
          example: "abc123xyz"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreateProposta"
      responses:
        "200":
          description: Proposta atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Proposta não encontrada
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /propostas/delete/{id}:
    delete:
      tags:
        - Propostas
      summary: Apagar uma proposta
      description: Apaga uma proposta específica pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da proposta a ser apagada
          schema:
            type: string
          example: "abc123xyz"
      responses:
        "200":
          description: Proposta apagada com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Proposta não encontrada
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
