# path/prestacaoServico.yaml

paths:
  /prestacao-servicos:
    get:
      tags:
        - Prestações de Serviço
      summary: Listar todas as prestações de serviço
      description: Retorna uma lista de todas as prestações de serviço disponíveis
      responses:
        "200":
          description: Lista de prestações de serviço retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/prestacaoServicos"
        "404":
          description: Nenhuma prestação de serviço encontrada
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /prestacao-servicos/create:
    post:
      tags:
        - Prestações de Serviço
      summary: Criar uma nova prestação de serviço
      description: Adiciona uma nova prestação de serviço ao sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreatePrestacaoServico"
      responses:
        "201":
          description: Prestação de serviço criada com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /prestacao-servicos/get-by-id/{id}:
    get:
      tags:
        - Prestações de Serviço
      summary: Obter prestação de serviço por ID
      description: Retorna os detalhes de uma prestação de serviço específica pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da prestação de serviço
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Prestação de serviço encontrada com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "404":
          description: Prestação de serviço não encontrada
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /prestacao-servicos/update/{id}:
    put:
      tags:
        - Prestações de Serviço
      summary: Atualizar uma prestação de serviço existente
      description: Atualiza os detalhes de uma prestação de serviço específica pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da prestação de serviço a ser atualizada
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreatePrestacaoServico"
      responses:
        "200":
          description: Prestação de serviço atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Prestação de serviço não encontrada
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /prestacao-servicos/delete/{id}:
    delete:
      tags:
        - Prestações de Serviço
      summary: Apagar uma prestação de serviço
      description: Apaga uma prestação de serviço específica pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da prestação de serviço a ser apagada
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Prestação de serviço apagada com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucesso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Prestação de serviço não encontrada
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
