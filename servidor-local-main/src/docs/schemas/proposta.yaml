components:
  schemas:
    Proposta:
      type: object
      properties:
        id:
          type: integer
          example: 1
        id_prestacao:
          type: integer
          example: 10
        preco_hora:
          type: number
          format: double
          example: 25
        horas_estimadas:
          type: integer
          example: 8
        estado:
          type: string
          enum: [pendente, aceito, recusado]
          example: pendente
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, id_prestacao, preco_hora, horas_estimadas, estado, enabled, created_at, updated_at]

    CreateProposta:
      type: object
      properties:
        id_prestacao:
          type: integer
          example: 10
        preco_hora:
          type: number
          format: double
          example: 25
        horas_estimadas:
          type: integer
          example: 8
        estado:
          type: string
          enum: [pendente, aceito, recusado]
          example: pendente
        enabled:
          type: boolean
          example: true
      required: [id_prestacao, preco_hora, horas_estimadas, estado, enabled]

    PropostaAceitacaoResultado:
      type: object
      properties:
        propostaId:
          type: integer
          example: 14
        prestacaoServicoId:
          type: integer
          example: 9
        orcamentoId:
          type: integer
          example: 4
        propostaAceite:
          type: string
          enum: [aceito]
          example: aceito
        propostasRejeitadas:
          type: integer
          example: 2
        estadoPrestacaoServico:
          type: string
          enum: [em_progresso]
          example: em_progresso
      required:
        [
          propostaId,
          prestacaoServicoId,
          orcamentoId,
          propostaAceite,
          propostasRejeitadas,
          estadoPrestacaoServico,
        ]
