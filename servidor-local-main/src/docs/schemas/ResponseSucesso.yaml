components:
  schemas:
    ResponseSucesso:
      type: object
      properties:
        status:
          type: string
          enum: [success]
          example: success
        message:
          type: string
          example: Requisicao realizada com sucesso
        data:
          nullable: true
          oneOf:
            - type: object
            - type: array
              items:
                type: object
            - type: string
            - type: number
            - type: boolean
      required: [status, message, data]
