components:
  schemas:
    ResponseError:
      type: object
      properties:
        status:
          type: string
          enum: [error]
          example: error
        message:
          type: string
          example: Erro ao realizar requisicao
        data:
          nullable: true
          oneOf:
            - type: object
            - type: array
              items:
                type: object
            - type: string
            - type: number
            - type: boolean
      required: [status, message, data]
