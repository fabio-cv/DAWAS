components:
  schemas:
    Orcamento:
      type: object
      properties:
        id:
          type: integer
          example: 1
        total:
          type: number
          format: double
          example: 250
        id_utilizador:
          type: string
          example: 6a6fa7d1-8b73-4f56-bf7d-a1d4d25194bb
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, total, id_utilizador, enabled, created_at, updated_at]

    CreateOrcamento:
      type: object
      properties:
        total:
          type: number
          format: double
          example: 0
        id_utilizador:
          type: string
          example: 6a6fa7d1-8b73-4f56-bf7d-a1d4d25194bb
        enabled:
          type: boolean
          example: true
      required: [total, id_utilizador, enabled]

    OrcamentoCalculoResultado:
      type: object
      properties:
        id:
          type: integer
          example: 1
        total:
          type: number
          format: double
          example: 325
        prestacoes_processadas:
          type: integer
          example: 2
      required: [id, total, prestacoes_processadas]
