# schema/user.yaml



components:
  schemas: 
    # schema principal de usuário
    users:
      type: object
      properties:
        id:
          type: string
          example: "jfufhebgfkjehvgbef"

        nome: 
          type: string
          example: "Fábio Barros"
        
        data_nascimento:
          type: string
          example: "1990-01-01"

        numero_identificacao:
          type: string
          example: "MUHR"

        email:
          type: string
          example: "teste123@gmail.com"

        telefone:
          type: string
          example: "87887986"

        pais:
          type: string
          example: "Cabo verde"

        localidade:
          type: string
          example: "Praia"

        password:
          type: string
          example: "teste123"

        enabled:
          type: boolean
          example: true

        created_at:
          type: string
          example: "2023-01-01T00:00:00Z"

        update_at:
          type: string
          example: "2023-01-01T00:00:00Z"

    # schema para criar um novo usuário
    CreateUser:
      type: object
      properties:
        nome: 
          type: string
          example: "Fábio Barros"

        data_nascimento:
          type: string
          example: "12-06-1950"

        numero_identificacao:
          type: string
          example: "MUHR"

        email:
          type: string
          example: "teste@gmail.com"

        telefone:
          type: string
          example: "87887986"

        pais:
          type: string
          example: "Cabo verde"

        localidade:
          type: string
          example: "Praia"

        password:
          type: string
          example: "123456"

        enabled:
          type: boolean
          example: true
    # schema para login
    LoginUser:
      type: object
      properties:
        email:
          type: string
          example: "user@example.com"

        password:
          type: string
          example: "senha123"

