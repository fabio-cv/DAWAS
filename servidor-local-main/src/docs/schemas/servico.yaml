components:
  schemas:
    # schema principal do serviço
    servicos:
      type: object
      properties:
        id:
          type: number
          example: 1

        nome:
          type: string
          example: "Serviço de Limpeza"

        desconto:
          type: string
          example: "10%"

        categoria:
          type: string
          example: "Limpeza"

        enabled:
          type: boolean
          example: true

        created_at:
          type: string
          example: "2023-01-01T00:00:00Z"

        update_at:
          type: string
          example: "2023-01-01T00:00:00Z"

    # schema generico para resposta de erro
    RespostaError:
      type: object
      properties:
        message:
          type: string
          example: "Erro ao buscar serviços"

        status:
          type: boolean
          example: false

        data:
          type: object
          properties: null
