#  schema/servico.yaml

components:
  schemas:
    # schema principal do serviço
    servicos:
      type: object
      properties:
        id:
          type: number
          example: 1

        nome:
          type: string
          example: "Serviço de Limpeza"

        desconto:
          type: string
          example: "10%"

        categoria:
          type: string
          example: "Limpeza"

        enabled:
          type: boolean
          example: true

        created_at:
          type: string
          example: "2023-01-01T00:00:00Z"

        update_at:
          type: string
          example: "2023-01-01T00:00:00Z"


    #schema para criar um novo serviço
    CreateService:
      type: object
      properties:
        nome: 
          type: string
          example: Serviço
        
        descrição:
          type: string
          example: Serviço de limpeza profisional para residências e empresas.
        
        categoria: 
          type: string
          example: Limpeza

        enabled:
          type: boolean
          example: true

